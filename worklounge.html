<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outta Beauty | Kira’s Work Lounge</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: #0c0914; 
        }
        
        body { 
            background: linear-gradient(rgba(12, 9, 20, 0.75), rgba(12, 9, 20, 0.75)), url('worklounge.jpeg') center/cover no-repeat fixed;
            color: #f4f3f7; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            line-height: 1.5; 
            text-align: center;
            display: flex;
            flex-direction: column;
        }

        /* Top Navigation Menu Frame */
        .nav-tabs {
            display: flex;
            justify-content: space-around;
            background: #000000;
            border-bottom: 2px solid #ff007f;
            padding: 12px 0;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-tab {
            color: #8a8894;
            text-decoration: none;
            flex: 1;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .nav-tab.active { color: #ff007f; }
        .nav-tab:hover { color: #ffffff; }

        /* Main Section Container Workspace */
        .main-content {
            max-width: 550px;
            margin: 0 auto;
            padding: 0 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            width: 100%;
        }

        /* Shrunk top margin to move Kira's Work Lounge up higher */
        .top-content {
            margin-top: 15px;
        }

        /* Centered Header Layout text */
        .worklounge-title {
            color: #ff007f;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 5px;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
        }

        /* 3D Room Container */
        .middle-selection {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 0;
            width: 100%;
            perspective: 1000px; /* Gives the page 3D depth */
            overflow: visible;
        }

        /* The Moving 3D Ring holding all photos */
        .photo-slider {
            position: relative;
            width: 280px;
            height: 380px;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: grab;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .photo-slider:active {
            cursor: grabbing;
        }

        /* 3D Photo Placement with Rounded Corners */
        .photo-card {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(20, 17, 31, 0.85);
            border: 1px solid rgba(255, 0, 127, 0.4);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            backface-visibility: visible;
            user-select: none;
            /* Places the 3 photos evenly in a 3D circle ring */
            transform: rotateY(var(--rotate-y)) translateZ(240px);
        }

        /* Displays the FULL image inside its 3D card */
        .photo-card img {
            width: 100%;
            height: auto;
            max-height: 100%;
            display: block;
            object-fit: contain;
            pointer-events: none;
        }

        /* Fixed Bottom Section Content Block wrapper locked higher up */
        .bottom-content {
            margin-top: auto;
            padding-bottom: 65px; /* Lifted both selection cards up higher away from the absolute screen base */
            width: 100%;
        }

        /* Sleek, lower-profile Cancellation Card */
        .policy-card {
            background-color: rgba(20, 17, 31, 0.85);
            border: 1px solid #ff007f;
            border-radius: 12px;
            padding: 12px 18px; 
            text-align: left;
            box-shadow: 0 8px 25px rgba(0,0,0,0.7);
            margin-bottom: 20px; 
            backdrop-filter: blur(5px);
        }

        .policy-card h3 {
            margin: 0 0 4px 0; 
            font-size: 0.9rem; 
            color: #ff007f;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .policy-card p {
            margin: 0;
            font-size: 0.8rem; 
            color: #dcdbe3;
            line-height: 1.4;
        }

        /* Booking Button */
        .book-now-button {
            display: inline-block;
            background-color: #ff007f;
            color: #ffffff;
            text-decoration: none;
            text-transform: uppercase;
            font-weight: bold;
            font-size: 0.95rem; 
            letter-spacing: 2px;
            padding: 12px 30px;
            border-radius: 50px;
            box-shadow: 0 0 20px #ff007f;
            transition: all 0.3s ease;
            width: auto;
        }

        .book-now-button:hover {
            background-color: #ffffff;
            color: #ff007f;
            box-shadow: 0 0 30px #ffffff;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- Navigation Menu Frame Link Set (Work Lounge Is Middle Tab Selection) -->
    <div class="nav-tabs">
        <a href="index.html" class="nav-tab">Home Lounge</a>
        <a href="worklounge.html" class="nav-tab active">Work Lounge</a>
        <a href="livecalendar.html" target="_blank" class="nav-tab">Live Booking</a>
    </div> 

    <!-- Main Content Layout Section Workspace Area -->
    <main class="main-content">
        
        <div class="top-content">
            <h1 class="worklounge-title">Kira’s Work Lounge</h1>
        </div>

        <!-- Middle 3D Carousel Selection Workspace Area -->
        <div class="middle-selection">
            <div class="photo-slider" id="carousel-ring">
                
                <div class="photo-card" style="--rotate-y: 0deg;">
                    <img src="20529735-fa90-4b0c-9c38-f23123dbc533.png">
                </div>

                <div class="photo-card" style="--rotate-y: 120deg;">
                    <img src="885f7052-c4cb-470c-aa7a-f750c9b4851f.png">
                </div>

                <div class="photo-card" style="--rotate-y: 240deg;">
                    <img src="c4d1b432-2e00-4303-a4be-c3b818ae9b9b.png">
                </div>

            </div>
        </div>

        <!-- Lower Section Content Block wrapper locked higher -->
        <div class="bottom-content">
            <!-- Cancellation Policy Block Frame layout section -->
            <div class="policy-card">
                <h3>Cancellation Policy</h3>
                <p>
                    Please note that no-shows as well as cancellations or rescheduling requests made after your appointment start time, are subject to a fee equal to 100% of the service.
                </p>
            </div>

            <!-- Direct Action Booking Button Link Trigger Section -->
            <a href="livecalendar.html" target="_blank" class="book-now-button">Book an Appointment Now</a>  
        </div>

    </main>

    <!-- Background Audio Element -->
    <audio id="salon-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- Interactive Touch Control Script -->
    <script>
        function playSalonMusic() {
            var track = document.getElementById("salon-music");
            track.play().catch(function(e) {
                console.log("Autoplay paused by browser security policy.");
            });
            document.removeEventListener('click', playSalonMusic);
            document.removeEventListener('touchstart', playSalonMusic);
            document.removeEventListener('scroll', playSalonMusic);
        }
        document.addEventListener('click', playSalonMusic);
        document.addEventListener('touchstart', playSalonMusic);
        document.addEventListener('scroll', playSalonMusic);
    </script>

    <!-- 3D Carousel Script -->
    <script>
        const ring = document.getElementById('carousel-ring');
        let currentAngle = 0;
        let isDragging = false;
        let startX = 0;
        let lastAngle = 0;
        let timer;

        // Auto-rotation system: steps 120 degrees every 1 minute
        function startAutoSlide() {
            timer = setInterval(() => {
                currentAngle -= 120;
                ring.style.transform = `rotateY(${currentAngle}deg)`;
            }, 60000); 
        }

        function resetAutoSlide() {
            clearInterval(timer);
            startAutoSlide();
        }

        // 3D Circle Drag & Swipe Controls
        const dragStart = (e) => {
            isDragging = true;
            clearInterval(timer);
            const touch = e.touches ? e.touches[0] : e;
            startX = touch.pageX;
            lastAngle = currentAngle;
        };

        const dragMove = (e) => {
            if (!isDragging) return;
            const touch = e.touches ? e.touches[0] : e;
            const diffX = touch.pageX - startX;
            currentAngle = lastAngle + (diffX * 0.4);
            ring.style.transform = `rotateY(${currentAngle}deg)`;
        };

        const dragEnd = () => {
            if (!isDragging) return;
            isDragging = false;
