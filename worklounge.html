<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Outta Beauty | Kira’s Work Lounge</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: #0c0914; 
            overflow-x: hidden;
        }
        
        body { 
            background: linear-gradient(rgba(12, 9, 20, 0.75), rgba(12, 9, 20, 0.75)), url('worklounge.jpeg') center/cover no-repeat fixed;
            color: #f4f3f7; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            line-height: 1.5; 
            text-align: center;
            display: flex;
            flex-direction: column;
        }

        /* Top Navigation Menu Frame */
        .nav-tabs {
            display: flex;
            justify-content: space-around;
            background: #000000;
            border-bottom: 2px solid #ff007f;
            padding: 12px 0;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-tab {
            color: #8a8894;
            text-decoration: none;
            flex: 1;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .nav-tab.active { color: #ff007f; }
        .nav-tab:hover { color: #ffffff; }

        /* Main Section Container Workspace */
        .main-content {
            max-width: 550px;
            margin: 0 auto;
            padding: 0 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            width: 100%;
        }

        /* Shrunk top margin to move Kira's Work Lounge up higher */
        .top-content {
            margin-top: 15px;
        }

        /* Centered Header Layout text */
        .worklounge-title {
            color: #ff007f;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 5px;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
        }

        /* Middle Slideshow Section Frame */
        .middle-selection {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px 0;
            width: 100%;
        }

        /* The Horizontal Finger-Swipe Slider Box */
        /* LOCKED AT 96% WIDTH FOR IMAGES */
        .photo-slider {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            gap: 0px;
            width: 96%; 
            max-width: 500px; 
            height: 420px; 
            margin: 0 auto;
            scrollbar-width: none; 
            -webkit-overflow-scrolling: touch; 
            touch-action: pan-x pan-y; 
        }
        
        /* Hides scrollbar on Safari (iPhone) and Chrome */
        .photo-slider::-webkit-scrollbar {
            display: none;
        }

        /* Clean Photo Cards with Rounded Corners */
        .photo-card {
            flex: 0 0 100%;
            width: 100%;
            height: 100%;
            scroll-snap-align: center;
            background: rgba(20, 17, 31, 0.85);
            border: 1px solid rgba(255, 0, 127, 0.4);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        /* Displays the FULL uncropped image cleanly inside the frame */
        .photo-card img {
            width: 100%;
            height: auto;
            max-height: 100%;
            display: block;
            object-fit: contain;
            pointer-events: none;
            -webkit-user-drag: none;
        }

        /* Hot Pink Swipe Message Style */
        .swipe-message {
            color: #ff007f !important;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.9rem;
            margin-top: 15px;
            text-shadow: 0 0 12px #ff007f, 0 0 5px rgba(255, 0, 127, 0.5);
            display: block;
        }

        /* Fixed Bottom Section Content Block wrapper locked higher up */
        .bottom-content {
            margin-top: 20px;
            padding-bottom: 65px; 
            width: 100%;
        }

        /* Sleek, lower-profile Cancellation Card */
        .policy-card {
            background-color: rgba(20, 17, 31, 0.85);
            border: 1px solid #ff007f;
            border-radius: 12px;
            padding: 12px 18px; 
            text-align: left;
            box-shadow: 0 8px 25px rgba(0,0,0,0.7);
            margin-bottom: 20px; 
            backdrop-filter: blur(5px);
        }

        .policy-card h3 {
            margin: 0 0 4px 0; 
            font-size: 0.9rem; 
            color: #ff007f;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .policy-card p {
            margin: 0;
            font-size: 0.8rem; 
            color: #dcdbe3;
            line-height: 1.4;
        }

        /* Booking Button */
        .book-now-button {
            display: inline-block;
            background-color: #ff007f;
            color: #ffffff;
            text-decoration: none;
            text-transform: uppercase;
            font-weight: bold;
            font-size: 0.95rem; 
            letter-spacing: 2px;
            padding: 12px 30px;
            border-radius: 50px;
            box-shadow: 0 0 20px #ff007f;
            transition: all 0.3s ease;
            width: auto;
        }

        .book-now-button:hover {
            background-color: #ffffff;
            color: #ff007f;
            box-shadow: 0 0 30px #ffffff;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- Navigation Menu Frame Link Set -->
    <div class="nav-tabs">
        <a href="index.html" class="nav-tab">Home Lounge</a>
        <a href="worklounge.html" class="nav-tab active">Work Lounge</a>
        <a href="livecalendar.html" target="_blank" class="nav-tab">Live Booking</a>
    </div> 

    <!-- Main Content Layout Section Workspace Area -->
    <main class="main-content">
        
        <div class="top-content">
            <h1 class="worklounge-title">Kira’s Work Lounge</h1>
        </div>

        <!-- Middle Swipe/Auto Slideshow Layout Area -->
        <div class="middle-selection">
            <div class="photo-slider" id="lounge-slider">
                
                <div class="photo-card">
                    <img src="20529735-fa90-4b0c-9c38-f23123dbc533.png">
                </div>

                <div class="photo-card">
                    <img src="885f7052-c4cb-470c-aa7a-f750c9b4851f.png">
                </div>

                <div class="photo-card">
                    <img src="c4d1b432-2e00-4303-a4be-c3b818ae9b9b.png">
                </div>

            </div>

            <!-- Hot Pink Target Swipe Notice Text Element Sits Exactly Under the Slideshow -->
            <div class="swipe-message">💖SWIPE TO LOOK💖</div>
        </div>

        <!-- Lower Section Content Block wrapper locked higher -->
        <div class="bottom-content">
            <!-- Cancellation Policy Block Frame layout section -->
            <div class="policy-card">
                <h3>Cancellation Policy</h3>
                <p>
                    Please note that no-shows as well as cancellations or rescheduling requests made after your appointment start time, are subject to a fee equal to 100% of the service.
                </p>
            </div>

            <!-- Direct Action Booking Button Link Trigger Section -->
            <a href="livecalendar.html" target="_blank" class="book-now-button">Book an Appointment Now</a>  
        </div>

    </main>

    <!-- Background Audio Element -->
    <audio id="salon-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- Music Player + 1 Minute Automatic Slideshow Logic System -->
    <script>
        // 1. Continuous Background Music Player Tracker Loop
        const playMusic = () => {
            const track = document.getElementById("salon-music");
            if (track) {
                track.play().catch(e => console.log("Autoplay blocked"));
            }
            ["click", "touchstart", "scroll"].forEach(evt => document.removeEventListener(evt, playMusic));
        };
        ["click", "touchstart", "scroll"].forEach(evt => document.addEventListener(evt, playMusic));

        // 2. Photo-Only Slideshow Timer Tracker Loop (Changes PICTURES every 1 minute)
        const slider = document.getElementById('lounge-slider');
        let photoTimer;

        function startPhotoTimer() {
            clearInterval(photoTimer);
            photoTimer = setInterval(() => {
                if (slider) {
                    const cardWidth = slider.clientWidth;
                    const maxScroll = slider.scrollWidth - cardWidth;
                    
                    if (slider.scrollLeft >= maxScroll - 5) {
                        slider.scrollTo({ left: 0, behavior: 'smooth' }); 
                    } else {
                        slider.scrollBy({ left: cardWidth, behavior: 'smooth' }); 
                    }
                }
            }, 60000); 
        }

        if (slider) {
            slider.addEventListener('touchstart', () => clearInterval(photoTimer));
            slider.addEventListener('touchend', startPhotoTimer);
            startPhotoTimer();
        }
    </script>


</body>
</html>
